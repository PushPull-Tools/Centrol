<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Connexion</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#11141b">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login">
  <div id="lbg" aria-hidden="true"></div>
  <main class="login-card">
    <img src="/favicon.svg" alt="" class="login-logo" id="logo" width="64" height="64">
    <h1 id="name">Centrol</h1>
    <p class="muted" id="sub">Connecte-toi avec ton utilisateur du serveur ou ton compte Centrol.</p>
    <form id="f" autocomplete="on">
      <label>Utilisateur<input name="username" autocomplete="username" required autofocus autocapitalize="off" spellcheck="false"></label>
      <label>Mot de passe<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="merr" id="err" role="alert"></p>
      <button class="btn primary wide" type="submit">Se connecter</button>
    </form>
    <form id="f2" hidden autocomplete="off">
      <label>Code de vérification<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="123456" required></label>
      <p class="hint">Code à 6 chiffres de ton appli d’authentification, ou un code de secours.</p>
      <p class="merr" id="err2" role="alert"></p>
      <button class="btn primary wide" type="submit">Valider</button>
      <button class="btn ghost wide" type="button" id="back2">Retour</button>
    </form>
    <div id="sso" hidden><div class="or"><span>ou</span></div><a class="btn wide" id="ssoBtn" href="/auth/oidc">SSO</a></div>
    <p class="ver" id="ver"></p>
  </main>
<script type="module">
import {setLang, tr, translateDom} from '/static/js/i18n.js';
const $ = (s) => document.querySelector(s);
const f = $('#f'), f2 = $('#f2'), err = $('#err'), err2 = $('#err2');
let ticket = null;
const rd = new URLSearchParams(location.search).get('rd') || '';   // retour vers l'appli demandée (porte d'entrée, SSO)
const go = (j) => location.replace((j && j.next) || '/');
fetch('/api/public').then((r) => r.json()).then(async (p) => {
  await setLang(p.lang); translateDom();
  document.title = tr('Connexion') + ' · ' + p.name;
  $('#name').textContent = p.name;
  $('#logo').src = p.logo;
  if (p.accent) document.documentElement.style.setProperty('--accent', p.accent);
  if (p.background) { $('#lbg').style.backgroundImage = `url("${p.background}")`; document.body.classList.add('has-bg'); }
  if (p.oidc.enabled) { $('#sso').hidden = false; $('#ssoBtn').textContent = tr('Se connecter avec') + ' ' + p.oidc.label; if (rd) $('#ssoBtn').href = '/auth/oidc?rd=' + encodeURIComponent(rd); }
  $('#ver').textContent = 'Centrol ' + p.version;
}).catch(() => {});
if (new URLSearchParams(location.search).get('error') === 'sso') setTimeout(() => { err.textContent = tr('Connexion SSO refusée ou compte non autorisé.'); }, 300);
async function post(url, body) {
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json', 'X-Centrol': '1'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(tr((j.detail && (j.detail.message || j.detail)) || 'Connexion impossible'));
  return j;
}
f.addEventListener('submit', async (e) => {
  e.preventDefault(); err.textContent = '';
  const b = f.querySelector('button'); b.disabled = true;
  try {
    const j = await post('/api/login', {username: f.username.value.trim(), password: f.password.value, rd});
    if (j.totp) { ticket = j.ticket; f.hidden = true; f2.hidden = false; $('#sso').hidden = true; f2.code.focus(); }
    else go(j);
  } catch (ex) { err.textContent = ex.message; f.password.select(); }
  b.disabled = false;
});
f2.addEventListener('submit', async (e) => {
  e.preventDefault(); err2.textContent = '';
  const b = f2.querySelector('button'); b.disabled = true;
  try { go(await post('/api/login/totp', {ticket, code: f2.code.value})); }
  catch (ex) { err2.textContent = ex.message; f2.code.select(); if (/expir/i.test(ex.message)) setTimeout(() => location.reload(), 1500); }
  b.disabled = false;
});
// œil : montrer / cacher le mot de passe
{
  const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19c-6.4 0-10-7-10-7a18 18 0 0 1 4.2-5.1M9.9 5.2A9.6 9.6 0 0 1 12 5c6.4 0 10 7 10 7a18 18 0 0 1-2.1 3.1"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
  const inp = f.password, wrap = document.createElement('span'), b = document.createElement('button');
  wrap.className = 'pwrap'; inp.replaceWith(wrap); b.type = 'button'; b.className = 'pweye'; b.tabIndex = -1;
  const paint = () => { const on = inp.type === 'text'; b.innerHTML = on ? OFF : EYE; b.title = tr(on ? 'Masquer le mot de passe' : 'Afficher le mot de passe'); b.setAttribute('aria-label', b.title); };
  b.addEventListener('mousedown', (e) => e.preventDefault());
  b.addEventListener('click', () => { inp.type = inp.type === 'password' ? 'text' : 'password'; paint(); inp.focus(); });
  f.addEventListener('submit', () => { if (inp.type === 'text') { inp.type = 'password'; paint(); } }, true);   // le navigateur peut alors proposer d'enregistrer le mot de passe
  wrap.append(inp, b); paint();
}
$('#back2').onclick = () => { f2.hidden = true; f.hidden = false; f.password.value = ''; f.password.focus(); };
</script>
</body>
</html>
