<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>Centrol — configuration</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0a0c11; color: #e7eaf3; font: 14px system-ui, sans-serif; }
  form { width: min(420px, 90vw); background: #11141b; border: 1px solid #242a37; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
  h1 { margin: 0; font-size: 20px; }
  p { margin: 0; color: #8b93a7; }
  input { height: 40px; border-radius: 9px; border: 1px solid #2f3646; background: #0a0c11; color: inherit; padding: 0 12px; font-size: 14px; }
  button { height: 40px; border: 0; border-radius: 9px; background: #7c9cff; color: #0b0d14; font-weight: 600; font-size: 14px; cursor: pointer; }
  .err { color: #ff6b7a; min-height: 1em; }
</style>
</head>
<body>
<form id="f">
  <h1>Bienvenue dans Centrol</h1>
  <p>Adresse de ton Centrol (celle que tu ouvres dans le navigateur) :</p>
  <input id="u" placeholder="https://centrol.mondomaine.org" autofocus required>
  <span class="err" id="e"></span>
  <button>Se connecter</button>
  <p style="font-size:12px">Modifiable ensuite : menu Centrol › Changer de serveur (touche Alt pour afficher le menu).</p>
</form>
<script>
document.getElementById('f').addEventListener('submit', (ev) => {
  ev.preventDefault();
  let u = document.getElementById('u').value.trim();
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try { new URL(u); } catch { document.getElementById('e').textContent = 'Adresse invalide'; return; }
  window.centrol.setUrl(u.replace(/\/+$/, ''));
});
</script>
</body>
</html>
