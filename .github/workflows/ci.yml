name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python
        run: |
          pip install -r requirements.txt
          python -m compileall -q app
          CENTROL_DATA=/tmp/centrol python -c "import app.main"
      - name: JavaScript
        run: for f in static/js/*.js; do cp "$f" /tmp/m.mjs && node --check /tmp/m.mjs || exit 1; done
      - name: Installeur
        run: bash -n install.sh
      - name: Image Docker
        run: docker build -t centrol:ci .
