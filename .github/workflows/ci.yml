name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Dépendances
        run: |
          pip install -r requirements.txt pytest pytest-playwright pyyaml
          python -m playwright install --with-deps chromium
      - name: Python
        run: |
          python -m compileall -q app
          CENTROL_DATA=/tmp/centrol python -c "import app.main"
      - name: Tests (connexion, droits, SSO, interface dans Chromium)
        run: python -m pytest
      - name: JavaScript
        run: |
          for f in static/js/*.js; do cp "$f" /tmp/m.mjs && node --check /tmp/m.mjs || exit 1; done
          node --import ./tests/js/shim.mjs --test tests/js/*.test.mjs
      - name: Installeur
        run: bash -n install.sh
      - name: Image Docker
        run: docker build -t centrol:ci .
      - name: Module Home Assistant (Centrol Agent) se construit et répond
        run: |
          docker build -t centrol-agent-ha:ci centrol_agent
          mkdir -p /tmp/ha-data && echo '{"token":"","port":8323}' > /tmp/ha-data/options.json
          docker run -d --name ci-agent --network host -v /tmp/ha-data:/data -v /var/run/docker.sock:/run/docker.sock:ro centrol-agent-ha:ci
          sleep 3; docker logs ci-agent
          T=$(sudo cat /tmp/ha-data/token)
          curl -fsS -H "Authorization: Bearer $T" http://127.0.0.1:8323/v1/ping | grep -q '"ok": true'
          curl -fsS -H "Authorization: Bearer $T" http://127.0.0.1:8323/v1/containers | grep -q ci-agent
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8323/v1/ping)" = 401
      - name: L'image démarre et répond
        run: |
          docker run -d --name ci-centrol --tmpfs /data:uid=1000 centrol:ci
          for i in $(seq 1 30); do docker exec ci-centrol python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8322/healthz')" && exit 0; sleep 1; done
          docker logs ci-centrol; exit 1

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install
      - name: Le client de bureau se construit (sans publier)
        run: npx electron-builder --linux dir --publish never

  install:
    name: Installation neuve sur une machine vierge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Machine de test (utilisateur local, réseau du proxy)
        run: |
          sudo useradd -m -s /bin/bash ciadmin
          echo 'ciadmin:Ci-Passw0rd-42' | sudo chpasswd
          docker network create ci_proxy
          sudo mkdir -p /srv/docker && sudo cp -a "$GITHUB_WORKSPACE" /srv/docker/centrol
      - name: install.sh sans questions
        run: |
          cd /srv/docker/centrol
          sudo ASSUME_YES=1 ADMIN_USER=ciadmin ADMIN_PASSWORD=Ci-Passw0rd-42 PROXY_NETWORK=ci_proxy \
               CENTROL_URL=http://127.0.0.1:8322 ./install.sh < /dev/null
      - name: Centrol répond et la connexion fonctionne
        run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8322/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8322/login | grep -q '<form'
          sudo docker exec centrol python -m app.cli list | grep -E '^ciadmin +linux +admin'
          code=$(curl -s -o /dev/null -w '%{http_code}' -c /tmp/jar -H 'x-centrol: 1' -H 'Content-Type: application/json' \
                 -d '{"username":"ciadmin","password":"Ci-Passw0rd-42"}' http://127.0.0.1:8322/api/login)
          [ "$code" = 200 ] || { echo "connexion : $code"; exit 1; }
          curl -fsS -b /tmp/jar http://127.0.0.1:8322/api/me | grep -q '"admin": *true'
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'x-centrol: 1' -H 'Content-Type: application/json' \
                 -d '{"username":"ciadmin","password":"faux"}' http://127.0.0.1:8322/api/login)
          [ "$code" = 401 ] || [ "$code" = 403 ] || { echo "mauvais mot de passe accepté : $code"; exit 1; }
      - name: update.sh sur cette installation
        run: |
          cd /srv/docker/centrol
          sudo ASSUME_YES=1 NO_PULL=1 ./update.sh < /dev/null
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8322/healthz && exit 0; sleep 2; done
          exit 1
      - name: Journaux en cas d'échec
        if: failure()
        run: sudo docker logs centrol 2>&1 | tail -80 || true
