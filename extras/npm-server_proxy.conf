# Centrol — à placer dans <données NPM>/nginx/custom/server_proxy.conf
# (inclus automatiquement par Nginx Proxy Manager dans TOUS les hôtes proxy).
# Autorise l'affichage des applis dans Centrol, et seulement dans Centrol :
#  - retire X-Frame-Options ;
#  - ajoute l'adresse de Centrol à la règle CSP « frame-ancestors » existante
#    (les autres règles CSP de l'appli sont conservées) ;
#  - si l'appli n'avait que X-Frame-Options, le remplace par un frame-ancestors équivalent + Centrol.
# Remplace l'adresse ci-dessous par celle de ton Centrol.
header_filter_by_lua_block {
    local centrol = "https://centrol.example.org"
    local function has_fa(v) return v:lower():find("frame%-ancestors") ~= nil end
    local function fix(v)
        if has_fa(v) then
            return (v:gsub("([Ff][Rr][Aa][Mm][Ee]%-[Aa][Nn][Cc][Ee][Ss][Tt][Oo][Rr][Ss])([^;,]*)", "%1%2 " .. centrol))
        end
        return v
    end
    local xfo = ngx.header["X-Frame-Options"]
    if type(xfo) == "table" then xfo = xfo[1] end
    ngx.header["X-Frame-Options"] = nil
    local csp = ngx.header["Content-Security-Policy"]
    local had = false
    if type(csp) == "table" then
        for i, v in ipairs(csp) do
            if has_fa(v) then had = true end
            csp[i] = fix(v)
        end
    elseif csp then
        had = has_fa(csp)
        csp = fix(csp)
    end
    if xfo and not had then
        local fa = "frame-ancestors " .. (xfo:lower():find("sameorigin") and "'self' " or "") .. centrol
        if type(csp) == "table" then table.insert(csp, fa)
        elseif csp then csp = { csp, fa }
        else csp = fa end
    end
    if csp then ngx.header["Content-Security-Policy"] = csp end
}
